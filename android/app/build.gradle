plugins { id 'com.android.application' version '8.5.2' }
android {
 namespace 'com.thelastoffavelas.game'
 compileSdk 34
 defaultConfig {
  applicationId 'com.thelastoffavelas.game'
  minSdk 26
  targetSdk 34
  versionCode 1
  versionName '0.1.0'
  ndk { abiFilters 'arm64-v8a' }
 }
 buildTypes {
  release { minifyEnabled false; signingConfig signingConfigs.debug }
  debug {}
 }
 externalNativeBuild { cmake { path = file('src/main/jni/CMakeLists.txt') } }
}
dependencies { implementation 'androidx.appcompat:appcompat:1.7.0' }
configurations.all {
 resolutionStrategy {
  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
  force 'org.jetbrains.kotlin:kotlin-stdlib-common:1.8.22'
 }
}
